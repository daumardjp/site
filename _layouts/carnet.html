---
layout: default
---

<article class="post-content post-carnet">
  <div class="post-header">
    <div class="post-category">{{ page.category }}</div>
    <h1>{{ page.title }}</h1>
  </div>

  <div class="carnet-gallery">
    {% for img in page.images %}
      <figure class="carnet-figure">
        <img src="{{ img | relative_url }}" alt="">
        {% if page.captions and page.captions[forloop.index0] %}
          <figcaption>{{ page.captions[forloop.index0] }}</figcaption>
        {% endif %}
      </figure>
    {% endfor %}
  </div>
</article>
