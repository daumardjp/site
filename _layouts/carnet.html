---
layout: default
---

<div class="post-header">
  {% if page.category %}
    <span class="post-category">{{ page.category }}</span>
  {% endif %}
</div>

<article class="post-content post-carnet">
  <h1>{{ page.title }}</h1>

  <div class="carnet-gallery">
    {% for src in page.images %}
      <figure class="carnet-figure">
        <a href="{{ src | relative_url }}">
          <img
            class="carnet-img"
            src="{{ src | relative_url }}"
            alt=""
            data-lightbox="carnet"
            data-index="{{ forloop.index0 }}"
          >
        </a>
      </figure>
    {% endfor %}
  </div>
</article>
