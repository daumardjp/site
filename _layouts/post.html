---
layout: default
---

<article class="post-article">

  <div class="post-header">
    {% if page.category %}
      <span class="post-category">{{ page.category }}</span>
    {% endif %}
  </div>

  <div class="post-content">
    <h1>{{ page.title }}</h1>

    <div class="post-body">
      {{ content }}
    </div>

    <div class="post-footer">
      <a href="#top">Haut de page</a>
    </div>
  </div>

</article>
