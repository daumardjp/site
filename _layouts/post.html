---
layout: default
---

<article class="post-content">
  <div class="post-header">
    {% if page.category %}
      <span class="post-category">{{ page.category }}</span>
    {% endif %}
    <h1>{{ page.title }}</h1>
  </div>

  <div class="post-body">
    {{ content }}
  </div>

  <div class="post-footer">
    <a href="#top">Haut de page</a>
  </div>
</article>
